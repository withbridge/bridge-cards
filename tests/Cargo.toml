[package]
name = "tests"
version = "0.1.0"
edition = "2021"

[dev-dependencies]
bincode = "2.0.1"
litesvm = "^0.12"
litesvm-token = { version = "^0.12", features = ["token-2022"] }

serde = "1.0.219"
solana-sdk = "=3.0.0"
solana-signature = "=3.4.1"
tokio = { version = "1", features = ["full"] }
paste = "1.0"
# Do not load entrypoint in tests -- this ensures we will not have conflicts with the token22 program's security entrypoint.
bridge_cards = { path = "../programs/bridge_cards", features = [
  "no-entrypoint",
] }
anchor-lang = { version = "1.0.0", features = ["init-if-needed"] }
anchor-spl = "1.0.0"
account-data-trait = { path = "../account-data-trait" }
account-data-macro-derive = { path = "../account-data-macro-derive" }
base64 = "0.22.1"
borsh = "1"

[lib]
path = "src/lib.rs"
